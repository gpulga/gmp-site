<title>Gabriel's Media Portal</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
/* Tela de senha. A página de verdade vem cifrada (AES-GCM) e só abre aqui, no navegador, com a senha certa. */
:root { --bg: #fbfbf9; --bg2: #f1f0eb; --tx: #15171b; --tx2: #5b5f66; --ln: #c9c6bb; --ac: #0b4f8a; --erro: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #14161a; --bg2: #1c1f24; --tx: #eceef1; --tx2: #a3a8b0; --ln: #3a3e46; --ac: #84b9ea; --erro: #f2968c; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/1.5 "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; }
.cena { width: min(100%, 380px); display: grid; justify-items: center; gap: 18px; text-align: center; transition: opacity .45s ease, transform .6s cubic-bezier(.6, 0, .3, 1); }
.planeta { width: 132px; height: 132px; }
.planeta svg { width: 100%; height: 100%; overflow: visible; }
.anel { fill: none; stroke: var(--tx); stroke-width: 2.4; transform-origin: 50px 50px; transition: transform .7s cubic-bezier(.6, 0, .3, 1), opacity .6s; }
.anel-vao { fill: none; stroke: var(--bg); stroke-width: 8; }
.corpo { fill: var(--bg); } .borda { fill: none; stroke: var(--tx); stroke-width: 2.4; }
.lat { fill: none; stroke: var(--tx); stroke-width: .8; opacity: .28; }
.planeta text { font: 700 20px "IBM Plex Mono", ui-monospace, monospace; fill: var(--tx); letter-spacing: -.5px; }
.marca { display: grid; gap: 4px; }
.sub { font: 500 10.5px/1.3 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--tx2); }
h1 { font: 600 26px/1.15 "IBM Plex Serif", Georgia, serif; margin: 0; letter-spacing: -.01em; }
form { width: 100%; display: grid; gap: 10px; margin-top: 6px; }
.linha { display: flex; gap: 8px; }
input[type=password] { flex: 1; min-width: 0; font: 500 16px "IBM Plex Mono", ui-monospace, monospace; padding: 11px 12px; border: 1px solid var(--ln); border-radius: 4px; background: var(--bg); color: var(--tx); outline: none; }
input[type=password]:focus { border-color: var(--tx); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tx) 12%, transparent); }
button { font: 600 15px "IBM Plex Sans", sans-serif; padding: 0 18px; border: 0; border-radius: 4px; background: var(--tx); color: var(--bg); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
label { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13.5px; color: var(--tx2); cursor: pointer; }
.msg { min-height: 20px; font: 400 12.5px "IBM Plex Mono", ui-monospace, monospace; color: var(--tx2); }
.msg.erro { color: var(--erro); }
.rodape { font: 400 11px "IBM Plex Mono", ui-monospace, monospace; color: var(--tx2); opacity: .8; }
/* errou: a caixa balança */
.erra form { animation: balanca .42s cubic-bezier(.36, .07, .19, .97); }
@keyframes balanca { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
/* abrindo: o planeta acelera e o anel pulsa enquanto a chave é calculada */
.calcula .anel { animation: pulsa 1s ease-in-out infinite; }
@keyframes pulsa { 50% { transform: scale(1.08); } }
/* abriu: o anel se abre até cobrir a tela e a página entra */
.abre .anel { transform: scale(14); opacity: 0; }
.abre .cena { transform: scale(1.25); opacity: 0; }
.abre form, .abre .marca, .abre .rodape { opacity: 0; transition: opacity .25s; }
@media (prefers-reduced-motion: reduce) { .cena, .anel { transition: none; } .calcula .anel, .erra form { animation: none; } }
</style>
</head>
